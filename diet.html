<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Items</title>
    <link rel="stylesheet" href="diet.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="profile">
                <h2>User Profile</h2>
            </div>
            <nav class="nav">
                <h3>Challenges</h3>
                <ul>
                    <li><a href="#">Work-Out</a></li>
                    <li><a href="#">Balance-Diet</a></li>
                </ul>
                <h3>Rewards</h3>
                <ul>
                    <li><a href="#">Gift-Card</a></li>
                </ul>
            </nav>
            <button class="logout-btn">Log-Out</button>
        </aside>
        
        <div class="main-content">
            <h1>Food Items</h1>
            <table>
                <thead>
                    <tr>
                        <th>Food Name</th>
                        <th>Quantity</th>
                        <th>Calories</th>
                        <th>Protein</th>
                        <th>Fats</th>
                        <th>Carbs</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="food-table-body">
                    <!-- Food items will be rendered here -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="2" style="text-align: right;"><strong>Total:</strong></td>
                        <td id="total-calories">0</td>
                        <td id="total-protein">0g</td>
                        <td id="total-fats">0g</td>
                        <td id="total-carbs">0g</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
            <button id="add-more">Add More</button>
        </div>
    </div>
    <script src="diet.js"></script>
</body>
</html>
