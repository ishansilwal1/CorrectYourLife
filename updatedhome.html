<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correct Your Life</title>
    <link rel="stylesheet" href="updatedhome.css">
    <link href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>
        <div class="logo">
            <img src="better_logo.jpg" alt="Logo">
        </div>
        <h1>Correct Your Life</h1>
    </header>
    <main>
        <div class="content">
            <h2>Embrace the challenge</h2>
            <p>Elevate your journey to a healthier you. Better Your Life, better every day!</p>
            <div class="buttons">
                <button id="registerBtn">Register</button>
                <button id="loginBtn">LOG-IN</button>
            </div>
        </div>
    </main>
    <div class="popup" id="popup">
        <div class="popup-content">
            <span class="close" id="closePopup">&times;</span>
            <h2 id="popupTitle">Login</h2>
            <form id="popupForm">
                <!-- Form content inserted by JavaScript -->
            </form>

            <div id="socialButtons" class="social-buttons">
                <p>Or</p>
                <button class="btn facebook-btn">
                    <i class='bx bxl-facebook'></i> Sign up with Facebook
                </button>
                <button class="btn google-btn">
                    <i class='bx bxl-google'></i> Sign up with Google
                </button>
            </div>


            <div id="socialLoginButtons" class="social-buttons">
                <p>Or</p>
                <button class="btn facebook-btn">
                    <i class='bx bxl-facebook'></i> Login with Facebook
                </button>
                <button class="btn google-btn">
                    <i class='bx bxl-google'></i> Login with Google
                </button>
            </div>


            <div id="forgotPassword" class="forgot-password">
                <a href="#">Forgot password?</a>
            </div>

            
        </div>
    </div>
    <footer>
        <p>&copy; COPYRIGHT 2024</p>
    </footer>
    <script src="updatedhome.js"></script>
</body>
</html>
